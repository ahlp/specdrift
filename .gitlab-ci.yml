image: node:22-alpine

stages:
  - validate
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

before_script:
  - npm ci --cache .npm --prefer-offline

validate:typecheck:
  stage: validate
  script:
    - npm run typecheck

validate:test:
  stage: validate
  script:
    - npm test

build:package:
  stage: build
  script:
    - npm run build
    - node dist/cli/index.js --version
    - node dist/cli/index.js openspec validate --help
    - npm pack --dry-run
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
